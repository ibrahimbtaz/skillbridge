[PHP]
; Enable output buffering - PENTING untuk Laravel session/cookies
output_buffering = 4096

; Jangan flush otomatis
implicit_flush = Off

; Memory & upload limits
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M

; Timezone
date.timezone = Asia/Jakarta

; Error reporting
display_errors = On
error_reporting = E_ALL
log_errors = On

; Session settings - gunakan Laravel session handler
session.save_handler = files
session.save_path = /tmp
